spring.application.name=room-api
spring.datasource.url=jdbc:mysql://localhost:3306/roomdb
spring.datasource.username=roomapp
# Week 11: settings come from the environment. ${NAME:default} - the environment wins.
# Every default below is a class-only value. Never commit a real password or key.
spring.datasource.password=${DB_PASSWORD:roomapp1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Week 10: JWT. The real secret comes from the JWT_SECRET environment variable;
# the default below is for class only (at least 32 bytes for HS256).
app.jwt.secret=${JWT_SECRET:week10-devonly-secret-change-me-0123456789}
app.jwt.ttl-minutes=30
# Week 11: CORS. Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
